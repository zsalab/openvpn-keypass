name: Build standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (Windows/macOS)
        if: matrix.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python with Tk (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv python3-pip python-is-python3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build CLI binary
        run: python -m PyInstaller --onefile --name ovpn_keypass ovpn_keypass.py

      - name: Build GUI binary
        run: python -m PyInstaller --onefile --windowed --name ovpn_keypass_gui ovpn_keypass_gui.py

      - name: Ad-hoc code sign (macOS)
        if: matrix.platform == 'macos'
        run: |
          # These binaries aren't notarized (that needs a paid Apple
          # Developer account), so macOS still shows a Gatekeeper
          # warning on first run (see README). Ad-hoc signing just
          # keeps the binaries from being killed outright on Apple
          # Silicon and is good hygiene for an unsigned build.
          codesign --force --deep -s - dist/ovpn_keypass
          if [ -d dist/ovpn_keypass_gui.app ]; then
            codesign --force --deep -s - dist/ovpn_keypass_gui.app
          else
            codesign --force --deep -s - dist/ovpn_keypass_gui
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ovpn_keypass-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore executable permissions
        run: |
          # actions/upload-artifact does not reliably preserve the
          # executable bit, so set it explicitly before zipping.
          find artifacts -type f \( \
            -name "ovpn_keypass" -o -name "ovpn_keypass.exe" \
            -o -name "ovpn_keypass_gui" -o -name "ovpn_keypass_gui.exe" \
          \) -exec chmod +x {} +

      - name: Package per-platform archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r -y "../${name}.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
